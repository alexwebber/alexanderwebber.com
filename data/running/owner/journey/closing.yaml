heading: "If you're just starting"
text: |-
  If you're where I was in January 2023, here's what I'd say.

  It's never too late to be what you might have been.

  Start small. I started with walking. Remove every barrier you can, so that starting is easy, because starting is the hard part: do that first session, and routine takes care of the rest. Find a coach or a programme that changes how you think, not just how you move. Don't wait until you feel ready to be seen. If you slip back, you haven't failed. I did, twice. Only you can make the change, and you can always start again.
