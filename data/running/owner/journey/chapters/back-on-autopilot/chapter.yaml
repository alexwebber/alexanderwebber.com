id: back-on-autopilot
name: "Back on autopilot"
when: "2023-12/2024-12"
prose: |-
  Then I fell back into my old ways. Illness was part of it, but mainly it was just not caring again. I had gone back to autopilot, and by January 2025 I was back up to {{weight-jan-2025}}. It was very depressing.
takeaway: "You have to be strong enough to realise that only you can make the lifestyle change."
