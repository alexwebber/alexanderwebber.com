id: removing-every-barrier
name: "Removing every barrier"
when: "2023-03"
prose: |-
  My new year's resolution was to get fit, and I wanted nothing standing in the way. I had just finished renovating an outbuilding, which gave me the perfect spot for a treadmill, so I bought a NordicTrack Commercial x32i. It arrived in March 2023.

  There was one more reason to get going. The treadmill's limit was 300lbs. If I did nothing, I'd soon be too heavy for this type of equipment.

  It runs on iFit, which is kind of like the Netflix for exercise: a large and growing library of walking and running series, with highly motivational trainers travelling the globe. You follow them through lots of cool countries while they teach you everything about the exercise you're doing and why, and about the history, geography and culture of where you are. The treadmill speeds up, slows down and tilts to match the hills.

  And yes, I started with walking! It was Olympic rower Alex Gregory's walking series in Namibia. These series scheduled the workouts for me and made exercise addictive again. They removed all the barriers and really got me moving.
takeaway: "Remove every barrier."
