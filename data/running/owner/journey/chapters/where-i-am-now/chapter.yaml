id: where-i-am-now
name: "Where I am now"
when: "2026-11"
prose: |-
  Life feels so much better being fit. I need all the energy I can get to keep the show on the road: work, being a parent, keeping on top of a house and garden, marathon training, and finding ways to grow my skills as a software engineer as I become an agentic engineer. I think I need a VO2 max of at least the low 50s to deal with all of that at my best.

  After Brighton, I'd like to work towards qualifying times for some of the major marathons for my age group, and to run my first ultra next year: the whole of the Downs Link, from Guildford to Shoreham. I want to reach about 17.5% body fat and stay there, and to keep improving my fitness. And at some point I'd like to celebrate with a proper VO2 max test and a DEXA scan, to get real data on how far I've come.

  But Brighton comes first, and I'm [running it for Martlets](/running/fundraising/).
takeaway: "Fitness isn't the goal in itself. It's what gives me the energy for everything else."
