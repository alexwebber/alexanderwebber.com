# Running section settings (schemas/owner/section.schema.json). Every field except focus_race
# has a default.

focus_race:
  race_id: brighton-2027
  # The owner's Garmin Coach plan started on 5 Sep 2026.
  build_start: 2026-09-05
  charity:
    name: Martlets

garmin_devices:
  # Behind weight and body fat; it has always been the Index S2.
  scale: Index S2

# Seven goals plus the three achieved on 2 and 4 Nov 2026, through their "New" windows (to 18 Nov).
# Then those three are unfeatured and the limit goes back to 7 (owner, 2026-11-03).
featured_goal_limit: 10

# The landing page's link to the journey story (spec 003). The label must equal
# journey/page.yaml's approved link_label (owner, 2026-11-06).
story_link:
  href: /running/story/
  label: "How I got here: my running story"
