schema_version: "1.0"

preset:
  id: "house-constitution"
  name: "House Constitution Starting Point"
  version: "0.1.0"
  description: "Constitution template pre-seeded with house engineering-guardrail principles (Move Fast Spike First, Guarded Iteration) as the default starting menu for the constitution command, instead of the generic upstream examples."
  author: "Alex Webber"
  repository: "https://github.com/alexwebber/speckit-standards"
  license: "Proprietary"

requires:
  speckit_version: ">=0.14.0"

provides:
  templates:
    - type: "template"
      name: "constitution-template"
      file: "templates/constitution-template.md"
      description: "House-seeded constitution template"
      replaces: "constitution-template"

tags:
  - "constitution"
  - "house-style"
