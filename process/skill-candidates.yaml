# Tasks done by hand without a skill (the skills inventory, DECISIONS.md 2026-11-05). The agent keeps
# this current: after a phase, it adds a task done by hand, or adds one to `times`. `next` names the
# planned work that will need it: the agent builds the skill before that work starts (in the same
# session as the brief, or the one before), then removes the entry here in the skill's PR.
# /session-start lists the entries with a `next`. The lesson harvest's skills review goes through
# the rest. A general skill goes to software-factory (home: playbook), a project one to .claude/skills/.
#
#   - task: what is repeated, in a few words
#     times: how often so far (count from specs/*/tasks.md, DECISIONS.md and the PR list)
#     home: project | playbook
#     next: the work that next needs it (optional)

- task: Chart (SVG with an accessible name, the dataviz palette, label placement)
  times: 8
  home: project
- task: Provider adapter or ingest stage (Python, provider contract, archive)
  times: 2
  home: project
- task: Maintainability review (knip, vulture, findings grouped into refactor PRs)
  times: 1
  home: playbook
- task: Security alert triage (Dependabot, CodeQL, overrides with a reason)
  times: 3
  home: project
- task: Dependency research (current release, maintenance, a comparison in DECISIONS.md)
  times: 4
  home: playbook
- task: First-screen measurement and layout mock-ups (CSS and DOM injected into the built site, measured under Segoe UI, Roboto and DejaVu Sans, a side-by-side image for the owner)
  times: 2
  home: project
- task: Owner-approved content PR (wording drafted outside the repo, files written from the approved text by script, a scratch-copy comparison against it, approve-story, VOICE.md, a privacy search)
  times: 1
  home: project
  next: the Martlets story PR (002 T113-T115, 003 T092)
- task: Brief for another agent with access the project lacks (what I need back, confidentiality rules, a general example prompt that reports only what's there, pasted into the chat)
  times: 2
  home: playbook
- task: Folding a source into a private record (copy to sources/, internal names and colleagues kept out, quotes checked word for word, verbs checked, private terms added)
  times: 3
  home: project
