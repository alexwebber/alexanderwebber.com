# Throwaway (removed before merge): lists recent runs' computed average power for the owner to
# compare with Garmin Connect. Local archive on the runner only; nothing is written to R2.
name: Spike power check

on:
  push:
    branches: [claude/stoic-franklin-vhiumh]
    paths:
      - .github/workflows/spike-power-check.yml
      - spikes/intervals/power_check.py

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          working-directory: ingest
      - run: uv sync --locked
        working-directory: ingest
      - name: Fetch the last few weeks into a local archive
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
        run: uv run --project ingest awingest backfill --from 2026-09-20 --archive local --archive-dir "$RUNNER_TEMP/archive" > /dev/null 2>&1
      - name: Recent runs and their computed power
        run: uv run --project ingest python spikes/intervals/power_check.py "$RUNNER_TEMP/archive"
