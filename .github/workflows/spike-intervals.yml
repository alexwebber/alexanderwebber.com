# Throwaway (Spike 0): can GitHub Actions' datacenter IPs reach the intervals.icu API through its
# Cloudflare front? Prints HTTP statuses only; raw payloads stay on the ephemeral runner.
# Delete with the spike.
name: spike-intervals

on:
  push:
    branches: [001-slice1-phase1]
    paths: [spikes/intervals/**, .github/workflows/spike-intervals.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run the probe (statuses only)
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
        run: |
          python spikes/intervals/probe.py > /dev/null || true
          python - <<'EOF'
          import json, pathlib
          p = pathlib.Path("spikes/intervals/out/summary.json")
          if not p.exists():
              raise SystemExit("FAIL: no summary (activities call did not return 200)")
          s = json.loads(p.read_text())
          statuses = {k: v for k, v in s.items() if k.endswith("_status")}
          statuses |= {f"latest_run.{k}": v["status"] for k, v in s.get("latest_run", {}).items() if isinstance(v, dict)}
          print(json.dumps(statuses, indent=1))
          bad = {k: v for k, v in statuses.items() if v != 200}
          if bad:
              raise SystemExit(f"FAIL: {bad}")
          print("PASS: every call returned 200 from Actions")
          EOF
