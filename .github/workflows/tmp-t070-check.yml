# TEMPORARY (T070 and T067's ruleset check); removed before the PR is raised.
name: TMP T070 check
on:
  push:
    branches: [claude/loving-tesla-pw385y]
    paths: ['.github/workflows/tmp-t070-check.yml', '.github/tmp/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          working-directory: ingest
      - run: uv sync --locked --no-dev
        working-directory: ingest
      - name: R2 aggregates
        working-directory: ingest
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: uv run --no-sync python ../.github/tmp/t070_check.py
      - name: Rules on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "active rules on main:"; gh api "repos/$GITHUB_REPOSITORY/rules/branches/main" || true
          echo "rulesets:"; gh api "repos/$GITHUB_REPOSITORY/rulesets" || true
          echo "classic protection:"; gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.protected' || true
          echo "default workflow permissions:"; gh api "repos/$GITHUB_REPOSITORY/actions/permissions/workflow" || true
