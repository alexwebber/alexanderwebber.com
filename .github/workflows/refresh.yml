# Running data refresh (T067; contracts/pipeline.md "Workflows"): intervals.icu -> R2 -> published
# JSON -> gate -> bot commit to main -> deploy, with the ingest-failing alert after every fetch.
#
# Owner decision 1 (2026-10-04): the bot commits sanitised data straight to main, only after the
# gate passes, and only paths under data/running/published/. The publish job builds and gates the
# new tree with read-only permissions (it runs npm and ingest code); the commit job, the only one
# that can write, runs no third-party code: it applies the gated tree, checks the paths and pushes.
#
# A run on any ref other than main is fetch-only, like `fetch_only: true`, so a branch run can never
# publish. Commits made with GITHUB_TOKEN don't trigger other workflows, so gate.yml doesn't re-run
# for bot commits; this workflow deploys the build it gated instead.
#
# The 2-hourly trigger is the site Worker's Cloudflare cron, which dispatches this workflow on main
# (src/worker/refresh-trigger.ts). GitHub's `schedule` dropped slots and left 4-hour gaps
# (2026-10-18), so it is now only a 6-hourly backup: the guard job skips it while the dispatches
# arrive, and raises an issue when they stop.
#
# The 00:17 UTC run is the daily catch-all (T105, owner pick 2026-10-23): it always publishes, and
# it deploys its gated build even when no published data changed, so the landing page's countdown,
# its share image and other date-driven text follow the UK date. 00:17 UTC is after UK midnight in
# BST and GMT. This replaces a separate rebuild-daily workflow, to save Actions minutes.
name: Refresh

on:
  schedule:
    - cron: '47 1-23/6 * * *'
  workflow_dispatch:
    inputs:
      reimport_from:
        description: Re-fetch from this date (YYYY-MM-DD); empty for the normal incremental window
        type: string
        default: ''
      reimport_to:
        description: Re-fetch up to this date (YYYY-MM-DD); needs reimport_from
        type: string
        default: ''
      missing_only:
        description: With reimport_from, fetch only what is new or missing (e.g. a part the adapter added) instead of re-fetching everything
        type: boolean
        default: false
      fetch_only:
        description: Fetch and alert only (no publish, commit or deploy); the T070 smoke check
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'data/running/owner/**'

permissions:
  contents: read

# Runs never overlap, so two runs can't race on cursors, the run-ID map or bot commits. GitHub keeps
# at most one pending run per group: a newer one replaces it, which loses nothing, since each run
# fetches and publishes everything new.
concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  # Backup-schedule runs only, so dispatched runs don't pay for it. A dispatched run in the last
  # 150 minutes means the Worker's cron is working: skip. Otherwise refresh, and once none has
  # arrived for 6 hours open a refresh-trigger-failing issue (closed when dispatches resume). If the
  # check itself fails, the run goes ahead and the issue is left alone.
  guard:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LABEL: refresh-trigger-failing
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if ! last=$(gh run list --workflow refresh.yml --event workflow_dispatch --limit 1 --json createdAt --jq '.[0].createdAt // ""'); then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Couldn't list dispatched runs, so the backup schedule refreshes."
            exit 0
          fi
          age=100000
          if [ -n "$last" ]; then age=$(( ($(date -u +%s) - $(date -u -d "$last" +%s)) / 60 )); fi
          echo "Last dispatched refresh: ${last:-none} (${age} min ago)."
          open=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // ""') || open=''
          if [ "$age" -le 150 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "The Worker's cron is dispatching; the backup schedule skips this run."
            if [ -n "$open" ]; then
              gh issue close "$open" --comment "Dispatches resumed: the last dispatched refresh started at $last." ||
                echo "::warning::Couldn't close issue #$open."
            fi
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "::warning::No dispatched refresh in the last 150 minutes, so the backup schedule refreshes."
          if [ "$age" -gt 360 ] && [ -z "$open" ]; then
            gh label create "$LABEL" --color D93F0B --force --description "The Worker's cron isn't dispatching refresh.yml" || true
            gh issue create --label "$LABEL" --title "Refresh trigger failing (last dispatch: ${last:-none})" --body-file - <<EOF || echo "::warning::Couldn't open the $LABEL issue."
          The site Worker's Cloudflare cron should dispatch \`refresh.yml\` every 2 hours, but none has started in the last 6 hours (last dispatch: ${last:-none}). The 6-hourly backup schedule is refreshing instead, so data can lag by up to about 6 hours.

          **Likely cause:** the \`GITHUB_DISPATCH_TOKEN\` Worker secret expired, was revoked or is missing, or the cron trigger was removed from \`wrangler.jsonc\`.
          **Action:** check the Worker's logs (Cloudflare dashboard → Workers → alexanderwebber → Logs) for \`refresh_dispatch_failed\`, which names the cause. To replace the token, create a fine-grained token with Actions: write on this repository only, then run \`npx wrangler secret put GITHUB_DISPATCH_TOKEN\`.

          This issue closes itself once dispatches resume. Backup run: $RUN_URL
          EOF
          fi

  # Fetch, then the ingest-failing alert, in one job: Actions bills each job as at least a whole
  # minute, and both take seconds. The fetch step has its own timeout so the alert still runs.
  fetch:
    needs: guard
    if: ${{ !cancelled() && needs.guard.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      issues: write
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      daily: ${{ steps.decide.outputs.daily }}
    defaults:
      run:
        working-directory: ingest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          working-directory: ingest
          enable-cache: true

      - run: uv sync --locked --no-dev

      # stdout is the one-line JSON summary (logs go to stderr); the decide step reads it.
      - name: Fetch (intervals.icu -> R2)
        id: fetch
        timeout-minutes: 25
        shell: bash # -eo pipefail, so a failed fetch isn't hidden by tee
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          REIMPORT_FROM: ${{ inputs.reimport_from }}
          REIMPORT_TO: ${{ inputs.reimport_to }}
          MISSING_ONLY: ${{ inputs.missing_only && inputs.reimport_from != '' && 'yes' || '' }}
        run: >-
          uv run --no-sync awingest fetch --archive r2
          ${REIMPORT_FROM:+--reimport-from "$REIMPORT_FROM"}
          ${REIMPORT_TO:+--reimport-to "$REIMPORT_TO"}
          ${MISSING_ONLY:+--missing-only}
          | tee "$RUNNER_TEMP/fetch-summary.json"

      # After every fetch, even a failed one: opens, updates or closes the ingest-failing issue from
      # R2 state/fetch-status.json (alert contract: no success for 24 h).
      - name: Alert
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: uv run --no-sync awingest alert --archive r2

      # Publishing is skipped only when this run is provably idle: a clean fetch that archived
      # nothing new, after a refresh that succeeded, outside the daily catch-all (the 00:17 UTC
      # slot, which reprocesses after a processor change even on a day with no new data). Anything
      # unexpected publishes. `daily` marks the catch-all, whose gated build deploys even when no
      # published data changed (T105).
      - name: Decide whether to publish
        id: decide
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          FETCH: ${{ steps.fetch.outcome }}
          REIMPORT_FROM: ${{ inputs.reimport_from }}
        run: |
          summary="$RUNNER_TEMP/fetch-summary.json"
          daily=false
          if [ "$(date -u +%H)" = 00 ]; then daily=true; fi
          echo "daily=$daily" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = push ]; then reason='owner files changed'
          elif [ "$FETCH" != success ]; then reason="the fetch step's outcome was $FETCH"
          elif [ -n "$REIMPORT_FROM" ]; then reason='a re-import'
          elif [ "$daily" = true ]; then reason='the daily catch-all'
          elif ! idle=$(jq -r '.outcome == "ok" and .activities.fetched == 0 and .activities.topped_up == 0 and .wellness.written == 0' "$summary"); then
            reason="the fetch summary couldn't be read"
          elif [ "$idle" != true ]; then reason='the fetch archived new data or was partial'
          elif ! last=$(gh run list --workflow refresh.yml --branch main --status completed --limit 1 --json conclusion --jq '.[0].conclusion // ""'); then
            reason="the last refresh couldn't be checked"
          elif [ "$last" != success ]; then reason="the last refresh ended '${last:-unknown}'"
          else reason=''
          fi
          if [ -n "$reason" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Publishing: $reason."
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Nothing new since a successful refresh, so publishing is skipped."
          fi

  # Runs even when fetch failed: already-archived data and owner-file changes still publish.
  # `!cancelled()` here and on fetch also lets them run when guard is skipped (non-schedule events).
  # A missing decision (the fetch job died early) publishes.
  publish:
    needs: [guard, fetch]
    if: >-
      ${{ !cancelled() && needs.guard.outputs.skip != 'true' && github.ref == 'refs/heads/main' &&
      !inputs.fetch_only && needs.fetch.outputs.publish != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      base: ${{ steps.base.outputs.sha }}
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      # The newest main, not the commit that triggered the run: a queued run may start later.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          working-directory: ingest
          enable-cache: true

      - run: uv sync --locked --no-dev
        working-directory: ingest

      - name: Process (R2 -> data/running/published/)
        working-directory: ingest
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: uv run --no-sync awingest process --archive r2

      - name: Publish check
        working-directory: ingest
        run: uv run --no-sync awingest publish-check

      - uses: ./.github/actions/gate
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.R2_BUCKET }}

      # Only reached when the gate passed. Any change outside the published tree (a generated file
      # that isn't gitignored, a tool rewriting owner data) fails the run before anything is kept.
      - name: Check changed paths
        id: paths
        run: |
          changed=$(git status --porcelain --untracked-files=all | cut -c4-)
          outside=$(printf '%s\n' "$changed" | grep -v -e '^$' -e '^data/running/published/' || true)
          if [ -n "$outside" ]; then
            printf '%s\n' "$outside"
            echo "::error::The publish stage changed files outside data/running/published/; nothing is committed."
            exit 1
          fi
          if [ -n "$changed" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No published data changed."
          fi

      - name: Keep the gated published tree for the commit job
        if: steps.paths.outputs.changed == 'true'
        run: tar -cf "$RUNNER_TEMP/published.tar" data/running/published

      - if: steps.paths.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published
          path: ${{ runner.temp }}/published.tar
          retention-days: 1
          if-no-files-found: error

      - name: Keep the gated build for deploy
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  commit:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.publish.outputs.changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Credentials stay in .git/config for the push; this job runs only git and tar.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.base }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: published
          path: ${{ runner.temp }}

      # Replace the tree wholesale, so files the processor removed are removed here too.
      - name: Apply the gated tree
        run: |
          rm -rf data/running/published
          tar -xf "$RUNNER_TEMP/published.tar"
          git add --all data/running/published
          outside=$(git status --porcelain --untracked-files=all | cut -c4- | grep -v '^data/running/published/' || true)
          if [ -n "$outside" ]; then
            printf '%s\n' "$outside"
            echo "::error::The gated tree touches files outside data/running/published/; nothing is committed."
            exit 1
          fi

      # The push only fast-forwards from the commit that was gated. If main moved meanwhile it is
      # rejected and nothing is committed; the next run re-publishes from R2 on the new main.
      - name: Commit and push to main
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --quiet -m "data: publish running data" -m "Refresh run: $RUN_URL"
          if ! git push origin HEAD:refs/heads/main; then
            echo "::error::main moved since the gated commit, so the push was rejected; the next run re-publishes."
            exit 1
          fi

  # Deploys the build the gate passed: after a bot commit; after an owner-file push to main (whose
  # data the gate just built, even if no published file changed); or from the daily catch-all, so
  # date-driven pages (the countdown, the landing share image) follow the UK date (T105).
  deploy:
    needs: [fetch, publish, commit]
    if: >-
      ${{ !cancelled() && needs.publish.result == 'success' && (needs.commit.result == 'success' ||
      ((github.event_name == 'push' || needs.fetch.outputs.daily == 'true') && needs.commit.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.base }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm

      - run: npm ci

      - name: Deploy (wrangler deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
