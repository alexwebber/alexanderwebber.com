# Path-filtered test jobs on PRs (T044; adopted by the owner on 2026-10-04). They are not part of
# the build gate: each suite runs only when the PR touches the code it covers. Full lint on every
# change stays deferred (BACKLOG).
name: Tests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      pytest: ${{ steps.filter.outputs.pytest }}
      vitest: ${{ steps.filter.outputs.vitest }}
      playwright: ${{ steps.filter.outputs.playwright }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Match changed paths
        id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          printf '%s\n' "$changed"
          match() { printf '%s\n' "$changed" | grep -qE "$1" && echo true || echo false; }
          {
            echo "pytest=$(match '^(ingest|schemas)/')"
            echo "vitest=$(match '^((src|schemas|scripts|tests/unit|tests/contract)/|vitest\.config\.ts$|astro\.config\.mjs$)')"
            echo "playwright=$(match '^((src|public|data/running/owner|tests/e2e|tests/a11y|tests/fixtures)/|playwright\.config\.ts$|astro\.config\.mjs$)')"
          } >> "$GITHUB_OUTPUT"

  pytest:
    needs: changes
    if: needs.changes.outputs.pytest == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ingest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          working-directory: ingest
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest

  vitest:
    needs: changes
    if: needs.changes.outputs.vitest == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm test

  playwright:
    needs: changes
    if: needs.changes.outputs.playwright == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - run: npm ci
      # No --with-deps: its apt install (extra fonts and library upgrades) stalled on the Azure
      # Ubuntu mirror on PRs #44 and #45, both times in the font packages, and apt timeouts didn't
      # catch it. The runner image ships Chrome, so Chromium's system libraries are already there.
      - run: npx playwright install chromium
        timeout-minutes: 5
      # SHELL_PREVIEW=1 adds /shell-preview/ (astro.config.mjs), the page tests/a11y/shell.spec.ts
      # checks the shared shell on; deploy builds never set it.
      - run: npm run build
        env:
          SHELL_PREVIEW: '1'
      # Playwright + axe against astro preview (playwright.config.ts starts it).
      - run: npm run e2e
