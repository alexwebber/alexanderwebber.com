# THROWAWAY (removed before the PR is raised): checks the parts of Phase 2c-2d that need secrets.
# - the gate composite action with R2 credentials (run-ID map fetch path)
# - a real `wrangler deploy` of the gated build under a throwaway Worker name, then delete it
# - the RawArchive contract suite against real R2 under a test/ prefix
name: Spike - verify gate, deploy and R2 archive

on:
  push:
    branches: [claude/amazing-edison-3ode87]
    paths: [.github/workflows/spike-gate-verify.yml]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      WORKER: alexanderwebber-gate-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Gate (with R2 credentials)
        uses: ./.github/actions/gate
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.R2_BUCKET }}

      - name: Deploy the gated build under a throwaway name
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --name "$WORKER"

      - name: Serve check
        run: |
          url="https://$WORKER.alexanderwebber.workers.dev/"
          for i in $(seq 1 30); do
            code=$(curl -s -o page.html -w '%{http_code}' "$url" || true)
            echo "attempt $i: $code"
            if [ "$code" = 200 ] && grep -q 'Alexander Webber' page.html; then exit 0; fi
            sleep 10
          done
          exit 1

      - name: Delete the throwaway Worker
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler delete --name "$WORKER" || npx wrangler delete "$WORKER"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          working-directory: ingest

      - name: RawArchive contract suite against real R2
        working-directory: ingest
        env:
          AWINGEST_TEST_R2_LIVE: '1'
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          uv sync --locked
          uv run pytest tests/contract/test_raw_archive.py -k r2-live -v
